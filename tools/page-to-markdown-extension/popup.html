<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Duni Page to Markdown</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand"><span>BY</span>DUNI</div>
      <h1>Xuất Markdown</h1>
      <p class="hint">Ưu tiên popup/modal đang mở, sau đó đến nội dung chính của trang.</p>
      <button id="export-page" class="primary">Tải nội dung hiện tại</button>
      <button id="export-selection">Tải phần đã chọn</button>
      <button id="copy-page">Sao chép Markdown</button>
      <p id="status" role="status"></p>
      <small>Phím tắt: Alt + Shift + M</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
